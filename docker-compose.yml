# Home Assistant + Piper TTS stack for Synology DS923+ (Container Manager)
#
# Deploy: Container Manager → Project → Create → paste/upload this file.
# Set the project path to the folder containing this repo (e.g. /volume1/docker/crain-home-automation)
# so the relative volume paths below resolve.
#
# Before first start:
#   - Plug the SONOFF ZBDongle-P into a NAS USB port and confirm /dev/ttyUSB0
#     exists (see docs/01-nas-setup.md — DSM 7 needs a USB-serial driver package).
#   - Adjust TZ if not US Eastern.

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    # Host networking is required for device discovery (Reolink, Fully Kiosk, future Sonos)
    network_mode: host
    environment:
      - TZ=America/New_York
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    # UNCOMMENT when the SONOFF ZBDongle-P arrives (install roadmap Phase 1) —
    # mapping a device that doesn't exist yet prevents the container from
    # starting. If the path differs, check `ls /dev/ttyUSB*` via SSH.
    #devices:
    #  - /dev/ttyUSB0:/dev/ttyUSB0

  # Alexa voice control of HA devices ("Alexa, arm the alarm") — bridges HA
  # entities to the Echos as Matter devices. $0/month. Setup: copy
  # .env.example to .env, paste a long-lived HA access token (HA profile →
  # Security → Long-lived tokens), redeploy, open http://<NAS_IP>:8482,
  # then in the Alexa app: Add Device → Matter. Docs: docs/07 Alexa section.
  matter-hub:
    image: ghcr.io/t0bst4r/home-assistant-matter-hub:latest
    container_name: matter-hub
    restart: unless-stopped
    network_mode: host   # Matter commissioning needs mDNS
    environment:
      - HAMH_HOME_ASSISTANT_URL=http://localhost:8123
      - HAMH_HOME_ASSISTANT_ACCESS_TOKEN=${MATTER_HUB_TOKEN}
      - HAMH_HTTP_PORT=8482
    volumes:
      - ./matter-hub-data:/data

  # Music Assistant — uncomment when Sonos arrives: one "play anything
  # anywhere" layer across Sonos, Echos, and the Frame TVs. Free.
  # music-assistant:
  #   image: ghcr.io/music-assistant/server:latest
  #   container_name: music-assistant
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./music-assistant-data:/data

  # Service watchdog — monitors HA, Piper, Surveillance Station, cameras, and
  # alerts (push/email) if any of them stops responding. UI: http://<NAS_IP>:3001
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma-data:/app/data

  # Long-term metrics store for HA history (see docs/09-nas-services.md).
  # First run: open http://<NAS_IP>:8086, create org "crain-home", bucket
  # "homeassistant", and an API token → homeassistant/secrets.yaml.
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb-data:/var/lib/influxdb2

  # Dashboards over InfluxDB. UI: http://<NAS_IP>:3000 (admin/admin on first run).
  # user: "0" avoids volume-permission failures on Synology shared folders.
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    user: "0"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana

  # Local text-to-speech engine (Wyoming protocol). $0/month, fully offline.
  piper:
    image: rhasspy/wyoming-piper
    container_name: piper
    restart: unless-stopped
    command: --voice en_US-lessac-medium
    ports:
      - "10200:10200"
    volumes:
      - ./piper-data:/data

  # Local speech-to-text for the Assist voice pipeline (docs/12).
  # base-int8 fits the DS923+'s modest CPU; bump to small-int8 if responses
  # feel accurate enough to trade ~2x latency for better transcription.
  whisper:
    image: rhasspy/wyoming-whisper
    container_name: whisper
    restart: unless-stopped
    command: --model base-int8 --language en
    ports:
      - "10300:10300"
    volumes:
      - ./whisper-data:/data

  # Local wake-word detection ("Ok Nabu") for dedicated voice satellites.
  openwakeword:
    image: rhasspy/wyoming-openwakeword
    container_name: openwakeword
    restart: unless-stopped
    command: --preload-model 'ok_nabu'
    ports:
      - "10400:10400"

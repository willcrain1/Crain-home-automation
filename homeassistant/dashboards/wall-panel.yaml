# Wall-panel kiosk dashboard — shown fullscreen on both Galaxy Tab A9+ panels
# via Fully Kiosk Browser. Start URL for the tablets:
#   http://<NAS_IP>:8123/wall-panel/home
#
# View paths matter: the doorbell popup script navigates to /wall-panel/doorbell
# and back to /wall-panel/home.

title: Crain Home
views:
  # ── Main view ────────────────────────────────────────────────────────────
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Alarm
          - type: alarm-panel
            entity: alarm_control_panel.crain_alarm
            states:
              - arm_home
              - arm_away
          - type: heading
            heading: Doors & Windows
          - type: entities
            state_color: true
            entities:
              - binary_sensor.front_door_contact
              - binary_sensor.back_door_contact
              - binary_sensor.garage_door_contact
              - type: divider
              - binary_sensor.all_windows
              - binary_sensor.living_room_window_contact
              - binary_sensor.kitchen_window_contact
              - binary_sensor.dining_room_window_contact
              - binary_sensor.master_bedroom_window_contact
              - binary_sensor.guest_bedroom_window_contact
              - binary_sensor.office_window_contact

      - type: grid
        cards:
          - type: heading
            heading: Doorbell
          - type: picture-glance
            title: Front Door
            camera_image: camera.doorbell
            camera_view: live
            entities:
              - binary_sensor.doorbell_visitor
            tap_action:
              action: navigate
              navigation_path: /wall-panel/doorbell
          - type: heading
            heading: Cameras
          - type: picture-glance
            title: Front Porch
            camera_image: camera.front_porch
            camera_view: live
            entities: []
            tap_action:
              action: navigate
              navigation_path: /wall-panel/cameras
          - type: picture-glance
            title: Driveway
            camera_image: camera.driveway
            camera_view: live
            entities: []
            tap_action:
              action: navigate
              navigation_path: /wall-panel/cameras

  # ── Fullscreen doorbell (popup target) ──────────────────────────────────
  - title: Doorbell
    path: doorbell
    icon: mdi:doorbell-video
    type: panel
    cards:
      - type: picture-entity
        entity: camera.doorbell
        camera_image: camera.doorbell
        camera_view: live
        show_state: false
        show_name: false
        tap_action:
          action: navigate
          navigation_path: /wall-panel/home

  # ── All cameras ──────────────────────────────────────────────────────────
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: picture-glance
            title: Doorbell
            camera_image: camera.doorbell
            camera_view: live
            entities: []
          - type: picture-glance
            title: Front Porch
            camera_image: camera.front_porch
            camera_view: live
            entities: []
          - type: picture-glance
            title: Back Patio
            camera_image: camera.back_patio
            camera_view: live
            entities: []
      - type: grid
        cards:
          - type: picture-glance
            title: Driveway
            camera_image: camera.driveway
            camera_view: live
            entities: []
          - type: picture-glance
            title: Side Yard
            camera_image: camera.side_yard
            camera_view: live
            entities: []

  # ── House (garage, climate, lights, appliances, media) ──────────────────
  - title: House
    path: house
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Garage
          - type: entities
            state_color: true
            entities:
              - cover.garage_door
              - binary_sensor.garage_door_contact
              - input_boolean.garage_auto_close
          - type: heading
            heading: Climate
          - type: thermostat
            entity: climate.thermostat
          - type: heading
            heading: Weather
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
          - type: heading
            heading: Status
          - type: entities
            state_color: true
            entities:
              - binary_sensor.internet
              - sensor.speedtest_download
              - binary_sensor.on_battery_power
              - sensor.ups_battery_charge
              - sensor.generator_status
              - binary_sensor.house_occupied
              - binary_sensor.oven_on
              - sensor.dishwasher_cycle_state
              - vacuum.shark
              - type: divider
              - sensor.nas_volume_used
              - binary_sensor.nas_drive_problem

      - type: grid
        cards:
          - type: heading
            heading: Lights
          - type: entities
            state_color: true
            entities:
              - light.all_interior_lights
              - light.welcome_lights
              - light.outdoor_lights
              - type: divider
              - light.front_hall
              - light.kitchen
              - light.living_room
              - light.dining_room
              - light.master_bedroom
              - light.office
          - type: heading
            heading: Media
          - type: media-control
            entity: media_player.living_room_tv
          - type: media-control
            entity: media_player.bedroom_tv

  # ── Controls (announcement toggles, future Sonos & pool) ────────────────
  - title: Controls
    path: controls
    icon: mdi:tune
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Announcements
          - type: entities
            entities:
              - input_boolean.announcements_enabled
              - input_boolean.bedroom_announcements
              - input_boolean.alexa_announcements
          - type: heading
            heading: Automation Toggles
          - type: entities
            entities:
              - input_boolean.garage_auto_close
              - input_boolean.vacuum_when_away
              - input_boolean.movie_lights
              - input_boolean.auto_arm_when_empty
              - input_boolean.arrival_announcements
              - input_boolean.morning_briefing_enabled
              - input_datetime.briefing_time
              - input_number.internet_speed_floor
          - type: heading
            heading: System
          - type: entities
            entities:
              - input_text.panel_base_url
              - media_player.front_hall_panel
              - media_player.bedroom_panel
      # Future: Sonos media cards and pool controls get their own grid here.

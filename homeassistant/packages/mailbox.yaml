# Mailbox — a spare Zigbee contact sensor inside the mailbox
# (see docs/12-water-and-mailbox.md). Entity: binary_sensor.mailbox_contact
#
# 2-hour cooldown so opening it to *collect* the mail (or drop outgoing)
# doesn't re-announce.

automation:
  - id: mailbox_opened
    alias: "Mailbox: mail has arrived"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.mailbox_contact
        to: "on"
    conditions:
      - condition: time
        after: "08:00:00"
        before: "20:00:00"
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or now() - this.attributes.last_triggered > timedelta(hours=2) }}
    actions:
      - action: script.announce
        data:
          message: Mail has arrived.
          both_panels: false

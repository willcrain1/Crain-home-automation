# Internet speed accountability — built-in "Speedtest.net" integration
# (add via UI; it schedules periodic tests automatically).
# Entities: sensor.speedtest_download, sensor.speedtest_upload,
# sensor.speedtest_ping.
#
# Set the floor to ~80% of the AT&T plan speed you pay for.

input_number:
  internet_speed_floor:
    name: Internet Speed Floor
    icon: mdi:speedometer-slow
    unit_of_measurement: Mbit/s
    min: 10
    max: 1000
    step: 10
    initial: 100

automation:
  - id: speedtest_below_floor
    alias: "Network: speed test below floor"
    triggers:
      - trigger: numeric_state
        entity_id: sensor.speedtest_download
        below: input_number.internet_speed_floor
    actions:
      - action: script.notify_phones
        data:
          title: "🐌 Slow internet"
          message: >-
            Speed test came in at
            {{ states('sensor.speedtest_download') | round(0) }} Mbit/s down
            (floor: {{ states('input_number.internet_speed_floor') | round(0) }}).
            History is on the House dashboard — evidence for AT&T if it persists.

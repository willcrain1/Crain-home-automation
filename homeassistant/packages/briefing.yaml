# Morning briefing — weather + calendar + house status, spoken on the front
# hall panel at a set time. Requires the Google Calendar integration (free;
# rename or duplicate calendar.family below to match your calendar entity).
#
# Change the time on the wall panel (Controls view). Note: the initial value
# below re-applies on every HA restart — edit it here if you change it for good.

input_datetime:
  briefing_time:
    name: Morning Briefing Time
    has_date: false
    has_time: true
    initial: "07:00:00"

input_boolean:
  morning_briefing_enabled:
    name: Morning Briefing
    icon: mdi:weather-sunset-up

script:
  morning_briefing:
    alias: Morning briefing
    sequence:
      - action: weather.get_forecasts
        continue_on_error: true
        target:
          entity_id: weather.forecast_home
        data:
          type: daily
        response_variable: forecast_data
      - action: calendar.get_events
        continue_on_error: true
        target:
          entity_id: calendar.family
        data:
          start_date_time: "{{ today_at('00:00') }}"
          end_date_time: "{{ today_at('23:59') }}"
        response_variable: calendar_data
      - variables:
          today: >-
            {{ ((forecast_data | default({})).get('weather.forecast_home', {}).forecast
                | default([{}]))[0] | default({}) }}
          events: >-
            {{ (calendar_data | default({})).get('calendar.family', {}).get('events', []) }}
          message: >-
            Good morning.
            {%- if today.get('temperature') is not none %}
              Today's weather: {{ today.get('condition', '') }}, high of
              {{ today.get('temperature') | round(0) }},
              low of {{ today.get('templow', 0) | round(0) }}.
            {%- endif %}
            {%- if events | count > 0 %}
              On the calendar today:
              {%- for e in events %} {{ e.summary }}{{ ", " if not loop.last else "." }}{%- endfor %}
            {%- else %}
              Nothing on the calendar today.
            {%- endif %}
            {%- if is_state('cover.garage_door', 'open') %}
              The garage door is open.
            {%- endif %}
            {%- if is_state('binary_sensor.any_opening', 'on') %}
              A door or window is open.
            {%- endif %}
      - action: script.announce
        data:
          message: "{{ message }}"
          both_panels: false

automation:
  - id: morning_briefing_daily
    alias: "Briefing: speak every morning"
    triggers:
      - trigger: time
        at: input_datetime.briefing_time
    conditions:
      - condition: state
        entity_id: input_boolean.morning_briefing_enabled
        state: "on"
      # Skip when nobody is home to hear it.
      - condition: state
        entity_id: binary_sensor.house_occupied
        state: "on"
    actions:
      - action: script.morning_briefing
